name: Release

# Builds all downloads for a version tag (v1.2.3) and puts them into a DRAFT
# release. The maintainer then signs the files on their own computer
# (scripts/sign-release.ps1) and publishes the release by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, version and update key
        id: v
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"; exit 1
          fi
          if ! sed -n 2p assets/update-key.pub | grep -q '^RW'; then
            echo "assets/update-key.pub holds no public key yet (see docs/RELEASE.md)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup update stable && rustup default stable
      - name: Build
        run: cargo build --release --locked
      - name: Portable version and program file for updates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\mrsizeme.exe "dist\MrSizeMe-$env:VERSION-windows-x64.exe"
          $p = "dist\MrSizeMe-$env:VERSION-portable"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item target\release\mrsizeme.exe, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md, README.md $p
          Set-Content -Encoding utf8 "$p\portable.txt" "MrSizeMe portable: settings and history are kept in the folder MrSizeMe-Daten next to this file."
          Compress-Archive -Path "$p\*" -DestinationPath "dist\MrSizeMe-$env:VERSION-windows-x64-portable.zip"
          Remove-Item -Recurse -Force $p
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\target\release" "/DOutputDir=$PWD\dist" packaging\windows\mrsizeme.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  macos:
    needs: check
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup update stable && rustup default stable
      - name: App and disk image
        run: sh packaging/macos/make-dmg.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.dmg

  linux:
    needs: check
    # The oldest available system, so the program also runs on older Linux
    # versions (it needs at least the C library of the build system).
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Libraries for the window
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - name: Toolchain
        run: rustup update stable && rustup default stable
      - name: Archive
        run: sh packaging/linux/make-tar.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*.tar.gz

  draft:
    needs: [check, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          printf '\n\nEvery file has a SHA-256 checksum in SHA256SUMS.txt and a minisign signature (.minisig).\n' >> notes.md
      - name: Draft release (not published)
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "MrSizeMe $VERSION" --notes-file notes.md
