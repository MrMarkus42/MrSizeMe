[package]
name = "mrsizeme"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "MrSizeMe - shows which folders and files use the space on your disks"
license = "MIT OR Apache-2.0"
authors = ["Mr. M <mr.m@users.noreply.github.com>"]
readme = "README.md"
keywords = ["disk", "usage", "treemap", "folder", "size"]
categories = ["filesystem", "gui"]

[lib]
name = "mrsizeme"
path = "src/lib.rs"

[[bin]]
name = "mrsizeme"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
# The symbol fonts (▸ ▾ ⚠ …): no longer bundled by default since 0.37.
egui = { version = "=0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "=0.37.0", default-features = false }
rfd = "=0.17.2"
log = "0.4"
# Language of the operating system (for the default language).
sys-locale = "0.3"
serde_json = "1"
# Live update: tells the program when files change after a scan.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# Checksums: duplicate search and checking downloaded updates.
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
# Free space of a disk (statvfs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# HTTPS for the optional AI services: Windows and macOS use the TLS of the
# operating system, Linux uses rustls (no OpenSSL needed).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain for the user's own AI keys (already used by the TLS layer).
security-framework = "3"

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["eframe", "wgpu"] }
# Saves the screenshots of the window tests.
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
